<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScrollShot Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="app">
    <!-- ───────── Top bar ───────── -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 3l-1.5 2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2.5L15 3H9zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        </span>
        <span class="brand-name">ScrollShot</span>
      </div>

      <div class="topbar-actions">
        <button class="btn" id="btn-crop" title="Crop (C)">
          <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>
          <span>Crop</span>
        </button>
        <button class="btn" id="btn-copy" title="Copy to clipboard (Ctrl+C)">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy</span>
        </button>
        <div class="dropdown" id="dd-download">
          <button class="btn dropdown-toggle" title="Download image">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>Download</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <button data-format="png">PNG</button>
            <button data-format="jpeg">JPG</button>
            <button data-format="webp">WEBP</button>
          </div>
        </div>
        <button class="btn" id="btn-pdf" title="Export as PDF">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span>Export PDF</span>
        </button>
        <div class="dropdown" id="dd-export">
          <button class="btn btn-primary dropdown-toggle">
            <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
            <span>Export</span>
            <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu dropdown-menu-right">
            <button data-export="copy">Copy to clipboard</button>
            <button data-export="png">Download PNG</button>
            <button data-export="jpeg">Download JPG</button>
            <button data-export="webp">Download WEBP</button>
            <button data-export="pdf">Export PDF</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ───────── Main area ───────── -->
    <div class="main">
      <section class="workspace" id="workspace" tabindex="0">
        <div class="viewport" id="viewport">
          <div class="stage" id="stage">
            <canvas id="base-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
            <div id="crop-layer" class="crop-layer" hidden></div>
          </div>
        </div>

        <div class="notice" id="notice" hidden></div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-card">
            <h2 id="empty-title">Nothing to show</h2>
            <p id="empty-text"></p>
          </div>
        </div>

        <!-- Status bar -->
        <div class="statusbar">
          <span class="status-item" id="status-size">Canvas: — × —</span>
          <div class="dropdown dropup" id="dd-zoom">
            <button class="status-item dropdown-toggle" id="zoom-label">100%</button>
            <div class="dropdown-menu">
              <button data-zoom="fit">Fit</button>
              <button data-zoom="0.25">25%</button>
              <button data-zoom="0.5">50%</button>
              <button data-zoom="0.75">75%</button>
              <button data-zoom="1">100%</button>
              <button data-zoom="1.5">150%</button>
              <button data-zoom="2">200%</button>
              <button data-zoom="3">300%</button>
              <button data-zoom="4">400%</button>
            </div>
          </div>
          <button class="status-icon" id="zoom-out" title="Zoom out (−)">−</button>
          <button class="status-icon" id="zoom-in" title="Zoom in (+)">+</button>
        </div>
      </section>

      <!-- ───────── Right panel ───────── -->
      <aside class="side">
        <div class="card">
          <h3>Crop Settings</h3>
          <div class="field-row">
            <label class="field">
              <span>Width</span>
              <input type="number" id="crop-w" min="1" step="1">
            </label>
            <button class="link-btn" id="crop-link" title="Keep aspect ratio" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
            </button>
            <label class="field">
              <span>Height</span>
              <input type="number" id="crop-h" min="1" step="1">
            </label>
          </div>
          <label class="toggle-row">
            <span>Keep aspect ratio</span>
            <input type="checkbox" id="crop-aspect" class="toggle">
          </label>
          <div class="crop-actions" id="crop-actions" hidden>
            <button class="btn btn-primary btn-sm" id="crop-apply">Apply</button>
            <button class="btn btn-sm" id="crop-cancel">Cancel</button>
          </div>
        </div>

        <div class="card">
          <h3>Quick Actions</h3>
          <button class="action" data-export="copy">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
          <button class="action" data-export="download">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>Download</span>
          </button>
          <button class="action" data-export="pdf">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            <span>Export PDF</span>
          </button>
        </div>

        <div class="card">
          <h3>File Format</h3>
          <select id="file-format" class="select">
            <option value="png">PNG</option>
            <option value="jpeg">JPG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>
      </aside>
    </div>

    <!-- ───────── Bottom annotation toolbar ───────── -->
    <footer class="annobar">
      <div class="dropdown dropup" id="dd-shapes">
        <button class="tool dropdown-toggle" data-tool-group="shape" title="Shapes">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/><path d="M3 21l8-8"/></svg>
          <span id="shape-label">Shapes</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown-menu">
          <button data-tool="rect">Rectangle</button>
          <button data-tool="ellipse">Circle</button>
          <button data-tool="arrow">Arrow</button>
          <button data-tool="line">Line</button>
        </div>
      </div>
      <button class="tool" data-tool="pen" title="Freehand">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        <span>Freehand</span>
      </button>
      <button class="tool" data-tool="highlighter" title="Highlighter">
        <svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
        <span>Highlighter</span>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-7 7"/><path d="M6 11l7 7"/></svg>
        <span>Eraser</span>
      </button>
      <button class="tool" id="btn-delete" title="Delete selected (Del)">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        <span>Delete</span>
      </button>
      <span class="annobar-divider"></span>
      <button class="tool" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="btn-redo" title="Redo (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg>
        <span>Redo</span>
      </button>
      <span class="annobar-divider"></span>
      <div class="pen-size">
        <span class="label">Pen Size</span>
        <input type="range" id="pen-size" min="1" max="40" value="4">
        <span class="value" id="pen-size-label">4 px</span>
      </div>
      <span class="annobar-divider"></span>
      <div class="palette" id="palette">
        <span class="label">Color</span>
        <button class="swatch active" data-color="#2F6BFF" style="--c:#2F6BFF" title="Blue"></button>
        <button class="swatch" data-color="#8B5CF6" style="--c:#8B5CF6" title="Purple"></button>
        <button class="swatch" data-color="#EC4899" style="--c:#EC4899" title="Pink"></button>
        <button class="swatch" data-color="#FACC15" style="--c:#FACC15" title="Yellow"></button>
        <button class="swatch" data-color="#22C55E" style="--c:#22C55E" title="Green"></button>
        <button class="swatch" data-color="#64748B" style="--c:#64748B" title="Gray"></button>
        <label class="swatch custom" title="Custom color">
          <input type="color" id="custom-color" value="#2F6BFF">
        </label>
      </div>
    </footer>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script type="module" src="editor.js"></script>
</body>
</html>
